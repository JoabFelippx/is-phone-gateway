[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-gateway"
version = "0.1.0"
description = "Gateway web de sensores de celular para a arquitetura IS do LabSEA"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
  "is-msgs-sea>=1.3.1,<2",
  "is-wire-sea>=2.0.2,<3",
  "pillow>=11,<13",
  "numpy>=2,<3",
  "opencv-contrib-python-headless>=4.11,<5",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.12,<1"]
browser = ["playwright>=1.48,<2"]

[project.scripts]
phone-gateway = "phone_gateway.cli:main"

[tool.setuptools.packages.find]
include = ["phone_gateway*"]

[tool.setuptools.package-data]
phone_gateway = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
